# Euribor Tracker — reverse proxy to expose the app on the LAN (port 80).
# Install with:   make nginx-install
# Remove with:    make nginx-remove
#
# The app keeps listening on 127.0.0.1:8000; nginx fronts it on :80.
# If you want a hostname instead of the raw IP, set server_name, e.g.:
#     server_name tracker.lan;
# and add "tracker.lan" to /etc/hosts on your client machines.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/euribortracker.access.log;
    error_log  /var/log/nginx/euribortracker.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Optional: TLS with certbot
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # http2 on;
    # server_name tracker.lan;
    # ssl_certificate     /etc/letsencrypt/live/tracker.lan/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tracker.lan/privkey.pem;
}